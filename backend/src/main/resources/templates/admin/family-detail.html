<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${family.name} + ' - FamilyApp Admin'">Family Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-wrapper">
    <nav class="sidebar">
        <div class="sidebar-header"><span class="brand-icon">👨‍👩‍👧‍👦</span><span class="brand-text">FamilyApp</span></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
            <li><a th:href="@{/admin/users}"><i class="fas fa-users"></i><span>Users</span></a></li>
            <li class="active"><a th:href="@{/admin/families}"><i class="fas fa-house-chimney"></i><span>Families</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a th:href="@{/admin/logout}" class="btn-logout"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></a>
        </div>
    </nav>

    <main class="main-content">
        <header class="content-header">
            <div>
                <a th:href="@{/admin/families}" class="text-decoration-none text-secondary"><i class="fas fa-arrow-left me-2"></i>Back to Families</a>
                <h1 th:text="${family.name}">Family Name</h1>
            </div>
        </header>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="content-card p-4">
                    <h3 class="mb-3"><i class="fas fa-info-circle me-2"></i>Family Info</h3>
                    <div class="info-row"><span class="info-label">Name</span><span th:text="${family.name}">Name</span></div>
                    <div class="info-row"><span class="info-label">Invite Code</span>
                        <code class="text-warning" th:text="${family.inviteCode}">CODE</code>
                    </div>
                    <div class="info-row"><span class="info-label">Members</span><span th:text="${family.memberCount}">0</span></div>
                    <div class="info-row"><span class="info-label">Created</span>
                        <span th:text="${#temporals.format(family.createdAt, 'dd MMMM yyyy')}">Date</span>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="content-card p-4">
                    <h3 class="mb-3"><i class="fas fa-users me-2"></i>Members</h3>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="member : ${members}">
                                <td>
                                    <div class="user-avatar-sm" th:text="${#strings.substring(member.name, 0, 1)}">A</div>
                                    <span th:text="${member.name}">Name</span>
                                </td>
                                <td th:text="${member.email}">Email</td>
                                <td><span class="role-badge" th:classappend="${member.role == 'ADMIN'} ? 'role-admin' : (${member.role == 'PARENT'} ? 'role-parent' : 'role-child')" th:text="${member.role}">ROLE</span></td>
                                <td>
                                    <span class="status-dot" th:classappend="${member.active} ? 'active' : 'inactive'"></span>
                                    <span th:text="${member.active} ? 'Active' : 'Inactive'">Active</span>
                                </td>
                                <td><a th:href="@{/admin/users/{id}(id=${member.id})}" class="btn btn-sm btn-outline-info"><i class="fas fa-eye"></i></a></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
