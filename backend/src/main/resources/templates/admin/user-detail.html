<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.name} + ' - FamilyApp Admin'">User Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-wrapper">
    <nav class="sidebar">
        <div class="sidebar-header"><span class="brand-icon">👨‍👩‍👧‍👦</span><span class="brand-text">FamilyApp</span></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
            <li class="active"><a th:href="@{/admin/users}"><i class="fas fa-users"></i><span>Users</span></a></li>
            <li><a th:href="@{/admin/families}"><i class="fas fa-house-chimney"></i><span>Families</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a th:href="@{/admin/logout}" class="btn-logout"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></a>
        </div>
    </nav>

    <main class="main-content">
        <header class="content-header">
            <div>
                <a th:href="@{/admin/users}" class="text-decoration-none text-secondary"><i class="fas fa-arrow-left me-2"></i>Back to Users</a>
                <h1 th:text="${user.name}">User Name</h1>
            </div>
        </header>

        <div class="row g-4">
            <!-- User Info Card -->
            <div class="col-md-6">
                <div class="content-card p-4">
                    <h3 class="mb-3"><i class="fas fa-user me-2"></i>User Information</h3>
                    <div class="info-row"><span class="info-label">Name</span><span th:text="${user.name}">Name</span></div>
                    <div class="info-row"><span class="info-label">Email</span><span th:text="${user.email}">Email</span></div>
                    <div class="info-row"><span class="info-label">Role</span>
                        <span class="role-badge" th:classappend="${user.role == 'ADMIN'} ? 'role-admin' : (${user.role == 'PARENT'} ? 'role-parent' : 'role-child')"
                              th:text="${user.role}">ROLE</span>
                    </div>
                    <div class="info-row"><span class="info-label">Family</span><span th:text="${user.familyName ?: '—'}">Family</span></div>
                    <div class="info-row"><span class="info-label">Status</span>
                        <span class="status-dot" th:classappend="${user.active} ? 'active' : 'inactive'"></span>
                        <span th:text="${user.active} ? 'Active' : 'Inactive'">Active</span>
                    </div>
                    <div class="info-row"><span class="info-label">Joined</span>
                        <span th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy, HH:mm')}">Date</span>
                    </div>
                </div>
            </div>

            <!-- Location Card -->
            <div class="col-md-6">
                <div class="content-card p-4">
                    <h3 class="mb-3"><i class="fas fa-map-marker-alt me-2"></i>Last Known Location</h3>
                    <div th:if="${user.lastLatitude != null}">
                        <div class="info-row"><span class="info-label">Latitude</span><span th:text="${user.lastLatitude}">0</span></div>
                        <div class="info-row"><span class="info-label">Longitude</span><span th:text="${user.lastLongitude}">0</span></div>
                        <div class="info-row"><span class="info-label">Updated</span>
                            <span th:text="${#temporals.format(user.lastLocationUpdate, 'dd MMM yyyy, HH:mm')}">Date</span>
                        </div>
                    </div>
                    <p th:if="${user.lastLatitude == null}" class="text-muted">No location data available</p>
                </div>
            </div>

            <!-- Actions Card -->
            <div class="col-12">
                <div class="content-card p-4">
                    <h3 class="mb-3"><i class="fas fa-cogs me-2"></i>Actions</h3>
                    <div class="d-flex gap-3 flex-wrap">
                        <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post">
                            <button type="submit" class="btn"
                                    th:classappend="${user.active} ? 'btn-warning' : 'btn-success'">
                                <i class="fas" th:classappend="${user.active} ? 'fa-ban' : 'fa-check'"></i>
                                <span th:text="${user.active} ? ' Deactivate User' : ' Activate User'">Toggle</span>
                            </button>
                        </form>
                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-flex gap-2">
                            <select name="role" class="form-select form-select-sm bg-dark text-light border-secondary" style="width: auto;">
                                <option th:each="r : ${roles}" th:value="${r.name()}" th:text="${r.name()}" th:selected="${r.name() == user.role}">Role</option>
                            </select>
                            <button type="submit" class="btn btn-outline-info btn-sm">Change Role</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
