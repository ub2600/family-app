<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Families - FamilyApp Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-wrapper">
    <nav class="sidebar">
        <div class="sidebar-header"><span class="brand-icon">👨‍👩‍👧‍👦</span><span class="brand-text">FamilyApp</span></div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/admin/dashboard}"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
            <li><a th:href="@{/admin/users}"><i class="fas fa-users"></i><span>Users</span></a></li>
            <li class="active"><a th:href="@{/admin/families}"><i class="fas fa-house-chimney"></i><span>Families</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a th:href="@{/admin/logout}" class="btn-logout"><i class="fas fa-sign-out-alt"></i><span>Sign Out</span></a>
        </div>
    </nav>

    <main class="main-content">
        <header class="content-header">
            <div>
                <h1>Families</h1>
                <p>Manage registered family groups</p>
            </div>
            <div class="header-stats">
                <span class="badge bg-primary" th:text="${#lists.size(families)} + ' Total'">0 Total</span>
            </div>
        </header>

        <div class="row g-4">
            <div class="col-md-4" th:each="family : ${families}">
                <div class="content-card p-4 family-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h3 class="mb-1" th:text="${family.name}">Family Name</h3>
                            <span class="text-muted small">
                                <i class="fas fa-key me-1"></i>
                                <span th:text="${family.inviteCode}">CODE</span>
                            </span>
                        </div>
                        <div class="family-avatar">🏠</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-info bg-opacity-25" th:text="${family.memberCount} + ' members'">0 members</span>
                            <br>
                            <small class="text-muted" th:text="'Created ' + ${#temporals.format(family.createdAt, 'dd MMM yyyy')}">Date</small>
                        </div>
                        <div class="d-flex gap-1">
                            <a th:href="@{/admin/families/{id}(id=${family.id})}" class="btn btn-sm btn-outline-info">
                                <i class="fas fa-eye"></i>
                            </a>
                            <form th:action="@{/admin/families/{id}/delete(id=${family.id})}" method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this family?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
