<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FamilyApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            color: #fff;
            font-weight: 700;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .login-card p { color: rgba(255,255,255,0.6); }
        .login-card .brand {
            font-size: 48px;
            margin-bottom: 24px;
        }
        .form-control {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 15px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: #7c5cfc;
            color: #fff;
            box-shadow: 0 0 0 3px rgba(124,92,252,0.25);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.35); }
        .form-label { color: rgba(255,255,255,0.7); font-weight: 500; font-size: 14px; }
        .btn-primary {
            background: linear-gradient(135deg, #7c5cfc, #a855f7);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124,92,252,0.4);
        }
        .alert { border-radius: 12px; }
    </style>
</head>
<body>
<div class="login-card text-center">
    <div class="brand">👨‍👩‍👧‍👦</div>
    <h1>FamilyApp Admin</h1>
    <p class="mb-4">Sign in to manage your platform</p>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>Invalid credentials
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>Successfully logged out
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/admin/login}" method="post" class="text-start">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="username" class="form-control" placeholder="admin@familyapp.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="fas fa-sign-in-alt me-2"></i>Sign In
        </button>
    </form>

    <p class="mt-4 mb-0" style="color: rgba(255,255,255,0.3); font-size: 13px;">
        Default: admin@familyapp.com / admin123
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
