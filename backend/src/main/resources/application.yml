server:
  port: 8080

spring:
  application:
    name: FamilyApp

  # H2 Database (Development)
  datasource:
    url: jdbc:h2:file:./data/familyapp
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
app:
  jwt:
    secret: familyapp-secret-key-change-in-production-must-be-256-bits-long-minimum
    expiration: 86400000  # 24 hours in milliseconds

# Logging
logging:
  level:
    com.familyapp: DEBUG
    org.springframework.security: INFO
